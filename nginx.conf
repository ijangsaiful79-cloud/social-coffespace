server {
    listen 80;
    server_name socialcoffe.autoinovasoftsolution.cloud;

    # Serve Next.js static assets directly (CSS, JS, images)
    location /_next/static/ {
        alias /root/dattingcoffe/.next/standalone/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve public folder directly
    location /public/ {
        alias /root/dattingcoffe/.next/standalone/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else to Next.js app
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
